name: deploy-main

# Fred/Desch-approved Host deploy ONLY. No Cloudflare, no nginx, no bind.
#
# LOCKED runs-on: [self-hosted, Linux, X64, thePlatform]
# Runner: thePlatform_tkrwallet online. Do not invent other labels.
#
# Triggers on push to main (+ manual dispatch). Intentionally NO pull_request
# trigger, so PRs stay mergeable on ci.yml (ubuntu-latest) alone and this job
# only ever runs on the Host runner with the Fred-cited paths below.
#
# HOLD — do NOT wire without Charles/Desch (NOT in this file by design):
#   - ./bind.sh / Cloudflare DNS+tunnel
#   - icehut nginx template apply
#   - tkrwallet-cloudflared
#   - eva targets

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, thePlatform]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Non-secret build matching Desch gates (mirrors ci.yml, no secrets).
      - name: Unit tests
        run: node app_test.js

      # Desch soft-PASS gates, enforced read-only before any deploy bytes move.
      - name: Desch gates (connect-src, no key material)
        run: |
          grep -q "connect-src 'self'" deploy/nginx/tkrwallet-edge.conf.template
          if grep -Eo "connect-src[^;\"]*" deploy/nginx/tkrwallet-edge.conf.template | grep -qv "connect-src 'self'"; then
            echo "GATE FAIL: connect-src widened beyond 'self'" >&2
            exit 1
          fi
          # Fred false-positive fix: a bare `mnemonic|seed phrase` grep matches
          # legitimate wallet API names (importMnemonic, mnemonicToSeedSync,
          # DOM ids, comments) in crypto.js, vendor/noble.js, ui.js, store.js —
          # not key material. Fail closed on REAL secret payloads instead:
          # quoted BIP39-like 12+ word phrases (all shipped js, including the
          # crypto surface that must name the APIs), and 64-hex private-key
          # string literals (vendor/ excluded: noble.js embeds audited, quoted
          # secp256k1 curve constants, not keys; crypto.js itself stays scanned).
          if grep -rqiE "\"[a-z]+( [a-z]+){11,}\"|'[a-z]+( [a-z]+){11,}'|\`[a-z]+( [a-z]+){11,}\`" --include="*.js" --exclude="app_test.js" --exclude-dir="tools" --exclude-dir="docs" --exclude-dir=".git" .; then
            echo "GATE FAIL: BIP39-like phrase literal in shipped tree" >&2
            exit 1
          fi
          if grep -rqiE "\"(0x)?[0-9a-fA-F]{64}\"|'(0x)?[0-9a-fA-F]{64}'|\`(0x)?[0-9a-fA-F]{64}\`" --include="*.js" --exclude="app_test.js" --exclude-dir=vendor --exclude-dir="tools" --exclude-dir="docs" --exclude-dir=".git" .; then
            echo "GATE FAIL: hex private-key literal in shipped tree" >&2
            exit 1
          fi
          echo "gates ok: connect-src 'self', no key material"

      # Fred Host deploy cite (LOCKED — wire ONLY this path, no secrets in YAML).
      - name: Fred-approved Host deploy (ship + apply only)
        run: |
          cd /opt/repo/thePlatform/tkrWallet
          git fetch origin main && git merge --ff-only origin/main
          WALLET_SRC=/opt/repo/thePlatform/tkrWallet \
            /opt/repo/thePlatform/blockchain-infrastructure/wallet-edge/ship-root.sh
          ssh -o BatchMode=yes chuck@caesar.local \
            'cd /opt/repo/thePlatform/blockchain-infrastructure/wallet-edge && WALLET_ROOT=/opt/repo/tkrwallet-pwa ./apply.sh'
